schema = "fkst.ops.deployment.v1"
cadence_enabled = true
cadence_interval_seconds = 300
guard_restart_attempt_limit = 3

[[deployment]]
id = "website"
target_identity = "ChronoAIProject/fkst-website"
github_write_enabled = false
managed_bot_logins = ["fkst-bot"]

[deployment.claim_posture]
mode = "label"
label_exclusive = false
[deployment.sources.target]
lock_ref = "target-source"
[deployment.sources.platform]
lock_ref = "platform-source"
[deployment.sources.engine]
lock_ref = "engine-source"
[deployment.packages]
platform = ["github-devloop", "github-devloop-pr", "github-devloop-integration"]
host = ["site-board"]
[deployment.integration]
upstream_branch = "main"
integration_branch = "integration"
rollup_merge = "enabled"
[deployment.machine]
target_checkout = "website-host"
platform_checkout = "website-platform"
engine_checkout = "engine-source"
engine_binary = "engine"
durable = "website-durable"
runtime = "website-runtime"
logs = "website-logs"
rate_pool = "shared-rate-pool"
bot_login = "github-bot"
[deployment.providers]
github_credential = "github-credential"
engine = "engine"
board_engine_durable = "engine-board"
board_github_control = "github-board"

[[provider]]
id = "engine"
kind = "engine"
implementation = "engine-source:bin/build-provider"
contract = "fkst.ops.engine.v1"
configuration = { build_command = ["make", "engine"] }
[[provider]]
id = "engine-board"
kind = "board.engine-durable"
implementation = "platform-source:providers/engine-board"
contract = "fkst.ops.board.engine-durable.v1"
configuration = {}
[[provider]]
id = "github-board"
kind = "board.github-control"
implementation = "platform-source:providers/github-board"
contract = "fkst.ops.board.github-control.v1"
configuration = {}
[[provider]]
id = "github-credential"
kind = "credential.github"
implementation = "fkst-ops:providers/github_credential_gh.py"
contract = "fkst.ops.credential.github.v1"
configuration = { source = "github-app" }
