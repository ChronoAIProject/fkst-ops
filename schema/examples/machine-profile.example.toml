schema = "fkst.ops.machine-profile.v1"

# Replace every angle-bracket placeholder locally. Do not commit machine values.
[roots]
packages-target-checkout = "<absolute path to the packages dogfood checkout>"
packages-platform-checkout = "<same absolute path as packages-target-checkout>"
packages-engine-checkout = "<absolute path to the substrate source checkout>"
packages-durable = "<absolute path to the stable packages durable root>"
packages-runtime = "<absolute path to the packages runtime root>"
packages-logs = "<absolute path to the supervise log root>"
packages-rate-pool = "<absolute path to the shared rate-pool root>"

[binaries]
packages-engine-binary = "<absolute path to the fkst-framework executable>"

[credentials]
packages-bot-login = "<GitHub bot login for this machine>"

[sets]
packages-managed-bots = ["<managed bot login>"]

[defaults]
packages-integration-branch = "<integration branch for this machine>"
