# Template only. Copy this file into the deployment repository and replace every
# angle-bracket placeholder. This is not a deployment declaration for fkst-ops.
schema = "fkst.ops.deployment.v1"

[[provider]]
id = "<engine-provider-id>"
kind = "engine"
implementation = "<engine-source-lock-id>:<relative-engine-provider-entrypoint>"
contract = "fkst.ops.engine.v1"

[[provider]]
id = "<engine-durable-board-provider-id>"
kind = "board.engine-durable"
implementation = "<engine-source-lock-id>:<relative-engine-durable-board-entrypoint>"
contract = "fkst.ops.board.engine-durable.v1"

[[provider]]
id = "<github-control-board-provider-id>"
kind = "board.github-control"
implementation = "<engine-source-lock-id>:<relative-github-control-board-entrypoint>"
contract = "fkst.ops.board.github-control.v1"

[[deployment]]
id = "<deployment-id>"
target_identity = "<target-identity>"
managed_bot_logins = ["<this-machine-bot-login>", "<peer-machine-bot-login>"]

[deployment.sources.target]
lock_ref = "<target-source-lock-id>"

[deployment.sources.platform]
lock_ref = "<platform-source-lock-id>"

[deployment.sources.engine]
lock_ref = "<engine-source-lock-id>"

[deployment.engine_revision]
path = "<safe-relative-revision-file>"

[deployment.packages]
platform = ["<platform-package-name>"]
host = ["<host-package-name>"]

[deployment.integration]
upstream_branch = "<upstream-branch-name>"
integration_branch = "machine:<integration-branch>"
rollup_merge = "<rollup-merge-setting>"

[deployment.machine]
target_checkout = "<target-checkout>"
platform_checkout = "<platform-checkout>"
engine_checkout = "<engine-checkout>"
engine_binary = "<engine-binary>"
durable = "<durable-root>"
runtime = "<runtime-root>"
logs = "<logs-root>"
rate_pool = "<rate-pool-root>"
bot_login = "<bot-login>"

[deployment.providers]
engine = "<engine-provider-id>"
board_engine_durable = "<engine-durable-board-provider-id>"
board_github_control = "<github-control-board-provider-id>"
