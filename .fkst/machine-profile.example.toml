# Template only. Replace every angle-bracket placeholder in the deployment
# repository's untracked machine-local copy before running the validator.
schema = "fkst.ops.machine-profile.v1"

[roots]
# Absolute path to the checkout containing the deployment target.
"<target-checkout>" = "<absolute-path-to-target-checkout>"
# Absolute path to the checkout providing platform packages.
"<platform-checkout>" = "<absolute-path-to-platform-checkout>"
# Absolute path to the checkout containing the pinned engine source.
"<engine-checkout>" = "<absolute-path-to-engine-checkout>"
# Absolute path to durable state; preserve the existing location across upgrades.
"<durable-root>" = "<absolute-path-to-durable-state>"
# Absolute path for transient runtime state.
"<runtime-root>" = "<absolute-path-to-runtime-state>"
# Absolute path for operator and engine logs.
"<logs-root>" = "<absolute-path-to-logs>"
# Absolute path to the shared rate-limit pool.
"<rate-pool-root>" = "<absolute-path-to-rate-limit-pool>"

[binaries]
# Absolute path to the executable engine binary.
"<engine-binary>" = "<absolute-path-to-engine-binary>"

[credentials]
# Machine-local login or credential selector used by the control provider.
"<bot-login>" = "<machine-local-bot-login>"

[sets]
# Complete set of machine-local bot identities managed by this deployment.
"<managed-bot-set>" = ["<machine-local-bot-identity>"]

[defaults]
# Concrete integration branch selected by the declaration's machine reference.
"<integration-branch>" = "<integration-branch-name>"
